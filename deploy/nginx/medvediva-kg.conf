# Medvediva — зеркало medvediva.kg (сборка VITE_SITE=kg). Отдельно от kochfit, .ru и preview: свой root, свой сертификат,
# только свои server_name. Релизы — /var/www/medvediva-kg/releases/<REL>, активный — симлинк current.
# Ставить как /etc/nginx/sites-available/medvediva-kg + симлинк в sites-enabled, затем nginx -t && reload.

server {
  listen 80;
  listen [::]:80;
  server_name medvediva.kg www.medvediva.kg;
  location /.well-known/acme-challenge/ { root /var/www/letsencrypt-medvediva; }
  location / { return 301 https://medvediva.kg$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.medvediva.kg;
  ssl_certificate /etc/letsencrypt/live/medvediva.kg/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/medvediva.kg/privkey.pem;
  return 301 https://medvediva.kg$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name medvediva.kg;
  ssl_certificate /etc/letsencrypt/live/medvediva.kg/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/medvediva.kg/privkey.pem;

  root /var/www/medvediva-kg/current;
  index index.html;
  error_page 404 /404.html;

  add_header X-Content-Type-Options nosniff always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

  location /.well-known/acme-challenge/ { root /var/www/letsencrypt-medvediva; }

  # Предзапись закрыта — на ПИТ, как на .ru (19.10.2026). 302: страница может вернуться
  location = /pred { return 302 /pit$is_args$args; }
  location = /pred/ { return 302 /pit$is_args$args; }
  location = /page42012570.html { return 302 /pit$is_args$args; }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|ttf|otf|eot|mp4|m3u8|ts)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }
}
